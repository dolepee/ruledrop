services:
  - type: web
    name: retrycredit
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4179
      - key: ALLOWED_ORIGIN
        value: https://retrycredit.dolepee.com
      - key: PUBLIC_ORIGIN
        value: https://retrycredit.dolepee.com
      - key: RETRYCREDIT_PUBLIC_ENABLED
        value: "false"
      - key: RETRYCREDIT_DEMO_PRIVATE_KEY
        sync: false
      - key: RETRYCREDIT_POOL_ADDRESS
        value: 0x81b5d955F4EbfaE02FF6346cf368A2c4347248A1
      - key: RETRYCREDIT_VERIFIER_ADDRESS
        value: 0x97Fa88CfCaeE1a5D4Ae749b9b5698F2147b986fC
      - key: SEPOLIA_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: RULEDROP_POOL_ADDRESS
        value: 0x6f8dE7e1599A0c8D38eB25996cB841a4920ed999
      - key: CREDITCOIN_RPC
        value: https://rpc.cc3-testnet.creditcoin.network
      - key: ATTESTCOIN_PROOF_BUILDER
        value: https://prover.cc3-testnet.creditcoin.network
      - key: ETHEREUM_RPC_URLS
        sync: false
