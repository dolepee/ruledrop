[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@gluwa/=node_modules/@gluwa/"
]

